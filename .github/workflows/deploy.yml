name: Deploy

# main'e gönderilince sunucuya yayınlar; tarayıcı testlerini (CI) beklemez.
# Sunucudaki derleme (tip kontrolü dahil) hata verirse eski sürüm çalışmaya devam eder.
# Sunucuya yalnızca kısıtlı bir anahtarla girilir; o anahtar sadece
# "bu kaynağı al ve yeniden başlat" işini yapabilir.
on:
  push:
    branches: [main]
  # Elle yayın: Actions > Deploy > Run workflow (istediğiniz dal).
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: SSH ayarı
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          # Windows'tan yapıştırılınca eklenebilen CR karakterlerini temizle.
          # Anahtar ya düz metin (-----BEGIN...) ya da tek satırlık base64 olabilir.
          clean="$(printf '%s' "$DEPLOY_KEY" | tr -d '\r')"
          case "$clean" in
            -----BEGIN*) printf '%s\n' "$clean" > ~/.ssh/deploy_key ;;
            *) printf '%s' "$clean" | tr -d ' \n' | base64 -d > ~/.ssh/deploy_key ;;
          esac
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          # Anahtar okunabiliyor mu? (Yanlış yapıştırılmışsa burada net bir hata görünür.)
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null

      - name: Kaynağı gönder ve yeniden başlat
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          git archive --format=tar.gz HEAD | \
            ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              "$DEPLOY_USER@$DEPLOY_HOST" deploy

      - name: Canlı kontrol
        run: |
          for i in $(seq 1 30); do
            if curl -fsS https://saas.numanbayram.com/api/health; then exit 0; fi
            sleep 5
          done
          echo "Canlı sağlık kontrolü başarısız" >&2
          exit 1
