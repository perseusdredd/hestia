# Hestia on the VPS: app + Postgres. HTTPS is served by Perseus' Caddy
# (it joins the perseus_default network as "hestia:3000").
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hestia
      POSTGRES_DB: hestia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - hestia-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hestia -d hestia"]
      interval: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://hestia:${POSTGRES_PASSWORD}@db:5432/hestia?schema=public
      DIRECT_URL: postgresql://hestia:${POSTGRES_PASSWORD}@db:5432/hestia?schema=public
    volumes:
      - hestia-files:/app/.storage
    depends_on:
      db:
        condition: service_healthy
    networks:
      default:
      perseus_default:
        aliases: [hestia]

networks:
  perseus_default:
    external: true

volumes:
  hestia-pgdata:
  hestia-files:
